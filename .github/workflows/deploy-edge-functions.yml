name: نشر دوالّ الحافة

# لماذا يوجد هذا الملف
# ------------------------------------------------------------------
# لافابل تنشر دوالّ Supabase حين تُعدَّل **من محادثتها**. أمّا ما يصل `main`
# دفعاً من GitHub — كعمل Claude Code — فيصل الكود ولا تُنشر الدالّة، فيبقى
# رابط العميل على نسخته القديمة بينما التطبيق على الجديدة.
#
# هذا المسار يسدّ الفجوة: كل دفعٍ إلى `main` يمسّ `supabase/functions/**`
# ينشر **الدوالّ المتغيّرة وحدها** — لا كلّها، حتى لا تُداس دالّةٌ عُدّلت من
# لوحة Supabase ولم تصل المستودع بعد.
#
# الإعداد لمرّة واحدة
# ------------------------------------------------------------------
# أضف سرّاً في المستودع: Settings ← Secrets and variables ← Actions ← New
#   الاسم:  SUPABASE_ACCESS_TOKEN
#   القيمة: توكن من https://supabase.com/dashboard/account/tokens
# ومعرّف المشروع يُقرأ من `supabase/config.toml` فلا يُكتب مرّتين.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-edge-functions.yml"
  # تشغيل يدوي: اتركه فارغاً لنشر الكلّ، أو اكتب اسم دالّة بعينها.
  workflow_dispatch:
    inputs:
      function:
        description: "اسم دالّة بعينها (فارغ = كل الدوالّ)"
        required: false
        default: ""

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # نحتاج الكوميت السابق لنعرف ما الذي تغيّر في هذه الدفعة.
          fetch-depth: 2

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: قراءة معرّف المشروع من config.toml
        id: project
        run: |
          ref="$(grep -oP '^\s*project_id\s*=\s*"\K[^"]+' supabase/config.toml | head -1)"
          if [ -z "$ref" ]; then
            echo "::error::تعذّرت قراءة project_id من supabase/config.toml"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "المشروع: $ref"

      - name: تحديد الدوالّ المراد نشرها
        id: pick
        run: |
          set -euo pipefail
          all_functions() {
            find supabase/functions -mindepth 1 -maxdepth 1 -type d \
              -not -name '_*' -printf '%f\n' | sort
          }

          manual="${{ github.event.inputs.function }}"
          if [ -n "$manual" ]; then
            list="$manual"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            list="$(all_functions)"
          else
            before="${{ github.event.before }}"
            # أوّل دفعة على الفرع تأتي بـbefore أصفاراً — حينها ننشر الكلّ.
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              list="$(all_functions)"
            else
              changed="$(git diff --name-only "$before" "${{ github.sha }}" -- supabase/functions/ || true)"
              # تغيّر config.toml أو ملفٌ مشترك (`_shared`) يمسّ الجميع.
              if git diff --name-only "$before" "${{ github.sha }}" \
                   | grep -qE '^supabase/config\.toml$|^supabase/functions/_'; then
                list="$(all_functions)"
              else
                list="$(echo "$changed" | awk -F/ 'NF>3 {print $3}' | sort -u)"
              fi
            fi
          fi

          list="$(echo "$list" | grep -v '^$' || true)"
          if [ -z "$list" ]; then
            echo "لا دالّة تغيّرت — لا شيء يُنشر."
          else
            echo "سيُنشر:"; echo "$list" | sed 's/^/  • /'
          fi
          {
            echo "list<<EOF"
            echo "$list"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: النشر
        if: steps.pick.outputs.list != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::السرّ SUPABASE_ACCESS_TOKEN غير مضبوط — راجع تعليقات هذا الملف."
            exit 1
          fi
          failed=0
          while IFS= read -r fn; do
            [ -z "$fn" ] && continue
            if [ ! -d "supabase/functions/$fn" ]; then
              echo "::warning::لا مجلد للدالّة «$fn» — تخطّي."
              continue
            fi
            echo "::group::نشر $fn"
            # `verify_jwt` يُؤخذ من config.toml — راجع تعليقاته هناك.
            if supabase functions deploy "$fn" --project-ref "${{ steps.project.outputs.ref }}"; then
              echo "✅ $fn"
            else
              echo "::error::فشل نشر $fn"
              failed=1
            fi
            echo "::endgroup::"
          done <<< "${{ steps.pick.outputs.list }}"
          exit $failed
